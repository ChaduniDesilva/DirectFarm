<html>
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <section class="login-container">
<div class="wrapper">
  <form>
    <h1><center>Login</center></h1><br>
    <div class="input-box">
      Full Name <br><br><input type="text" placeholder="your name"><br><br>
      Email<br><br><input type="text" placeholder="your@email.com"><br><br>
      Password<br><br><input type="password"><br><br>
      </div>
    I am a <br><br>
<input type="radio" name="role" value="Consumer">Consumer<br>
<input type="radio" name="role" value="Farmer">Farmer
</div>
<button class="log-button">Create Account</button>
  </form>

  </section>
  </body>
</html>
